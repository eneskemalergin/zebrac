<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e2a"/>
      <stop offset="100%" stop-color="#0d0d14"/>
    </linearGradient>
    <clipPath id="z-clip">
      <path d="M 80,105 L 280,105 L 280,121 L 160,219 L 290,219 L 290,235 L 60,235 L 60,219 L 220,121 L 80,121 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <circle cx="200" cy="200" r="196" fill="url(#bg)" stroke="#2a2a3a" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="188" fill="none" stroke="#F7A41D" stroke-width="0.5" opacity="0.12"/>

  <!-- Terminal C-bracket -->
  <g fill="none" stroke="#F7A41D" stroke-width="7" stroke-linecap="square">
    <line x1="42" y1="105" x2="42" y2="235"/>
    <line x1="42" y1="105" x2="56" y2="105"/>
    <line x1="42" y1="235" x2="56" y2="235"/>
  </g>

  <!-- Z base shape (white) -->
  <path d="M 80,105 L 280,105 L 280,121 L 160,219 L 290,219 L 290,235 L 60,235 L 60,219 L 220,121 L 80,121 Z" fill="#FFFFFF"/>

  <!-- Zebra stripes: black · yellow · white -->
  <g clip-path="url(#z-clip)">
    <!-- Top bar stripes -->
    <rect x="80" y="105" width="18" height="16" fill="#000000"/>
    <rect x="118" y="105" width="18" height="16" fill="#F7A41D"/>
    <rect x="156" y="105" width="18" height="16" fill="#000000"/>
    <rect x="194" y="105" width="18" height="16" fill="#F7A41D"/>
    <rect x="232" y="105" width="18" height="16" fill="#000000"/>
    <rect x="265" y="105" width="15" height="16" fill="#F7A41D"/>

    <!-- Diagonal stripes (angled across the diagonal) -->
    <polygon points="115,210 140,210 178,121 153,121" fill="#000000"/>
    <polygon points="150,215 175,215 213,121 188,121" fill="#F7A41D"/>
    <polygon points="185,220 210,220 248,121 223,121" fill="#000000"/>
    <polygon points="220,226 245,226 280,124 280,121" fill="#F7A41D"/>

    <!-- Bottom bar stripes -->
    <rect x="60" y="219" width="18" height="16" fill="#000000"/>
    <rect x="98" y="219" width="18" height="16" fill="#F7A41D"/>
    <rect x="136" y="219" width="18" height="16" fill="#000000"/>
    <rect x="174" y="219" width="18" height="16" fill="#F7A41D"/>
    <rect x="212" y="219" width="18" height="16" fill="#000000"/>
    <rect x="250" y="219" width="18" height="16" fill="#F7A41D"/>
    <rect x="280" y="219" width="10" height="16" fill="#000000"/>
  </g>

  <!-- Z edge highlight -->
  <path d="M 80,105 L 280,105 L 280,121 L 160,219 L 290,219 L 290,235 L 60,235 L 60,219 L 220,121 L 80,121 Z" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

  <!-- Terminal > arrow -->
  <polyline points="306,152 324,170 306,188" fill="none" stroke="#F7A41D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Terminal _ cursor (blinking) -->
  <line x1="338" y1="190" x2="356" y2="190" stroke="#F7A41D" stroke-width="5" stroke-linecap="round">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- zebrac wordmark -->
  <text x="200" y="300" font-family="'Courier New', Courier, monospace" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="5">zebrac</text>
</svg>
