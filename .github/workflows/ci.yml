name: ci
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Format check
        run: zig fmt --check build.zig src/
      - name: Test
        run: zig build test

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        target: [ x86-linux, x86_64-linux, aarch64-linux, riscv64-linux ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build
        run: zig build -Doptimize=ReleaseSmall -Dtarget=${{ matrix.target }}
      - name: Smoke
        if: matrix.target == 'x86_64-linux'
        run: zig-out/bin/zebrac --quiet --min-samples 2 --max-samples 2 --warmup 0 --duration 300 /bin/true
      - name: Archive executable
        uses: actions/upload-artifact@v4
        with:
          name: zebrac-${{ matrix.target }}
          path: zig-out/bin/*
